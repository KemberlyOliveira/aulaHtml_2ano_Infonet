<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaeios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="col4 m-4">
        <h2>Formulário com bootrstrap</h2>
        <form>
            <label for="email" class="form-label">E-mail:</label>
            <input type="enail" class="form-control" id="email" placeholder="Insira seu E-mail"
                aria-describedby="emailaluda"> <!--caicha de entrsda -> sofuncionadentrodo form -->
            <div id="emailajuda" class="form-text">não compartilhamos o seu email</div>
            <label for="password" class="form-label">Senha:</label>
            <input type="password" name="password" placeholder="Digite sua senha" disabled>
            <!--disabled => deicha deabilitad-->
    </div>
    <div>
        <button type="submit" class="btn btn-primary">Cadastrar</button>
    </div>

    </form>
    <!-- form-control -->
    <div class="col-6 m-4">
        <h2> Crie seu post</h2>
        <form>
            <div class="mb-4">
                <label for="title" class="form-label">Titulo do post</label>
                <input type="text" class="form-control" id="title" name="title" pattern="Insira um titulo">
            </div>
            <div class="mb-4">
                <label for="content" class="form-label">Conteudo</label>
                <textarea type="content" class="form-control" id="content" name="content" rows="5"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Publicar</button>

            <!-- Somente leitura -->
            <div class="clo-4 m-4">
                <h2> Somente leitura</h2>
                <div class="mb-4">
                    <label for="email" class="form-label">E-mail:</label>
                    <input type="enail" class="form-control" id="email" placeholder="Insira seu E-mail" value="Joselene@g-mal.com" readonly>
                </div>
            </div>
            <!--Input de arquivo-->
            <div class="col-4 m-4">
                <h2>Teste input de atquivo</h2>
                <div class="mb-4">
                    <label for="foto" class="form-label">Apenas 1 arquivo</label>
                    <input type="file" class="form-control" id="foto">
                </div>
                <div class="mb-4">
                    <label for="foto" class="form-label">Multipols</label>
                    <input type="file" class="form-control" id="foto" multiple>
                </div>
            </div>
            <!--Datalist-->
            <div class="col-6 m-4">
                <h3>Datalist</h3>
                <div class="mb-4">
                    <label for="cidades" class="form-label">Seleciona uma cidade:</label>
                    <input class="form-control" list="datalistOptions" id="cidades" placeholder="busque sua cidade">
                    
                    <datalist id="datalistOptions">
                        <option value="Fesnandopolsi"></option>
                        <option value="Meridiano"></option>
                        <option value="Estrela D'Oeste"></option>
                        <option value="Pedranopolis"></option>
                        <option value="Arabá"></option>
                        <option value="Macedonia"></option>
                        <option value="Ouroeste"></option>
                    </datalist>
                </div>
            </div>
        </form>
    </div>


</body>

</html>
