<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<body>
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6">
                <img src="images/log.jpg" alt="usuario fazaendo login" class="img-fluid">
                <div class="text-center">
                    <a class="cadastro" href="cadastro.html">Ainda não tenho cadastro</a>
                  </div>
            </div>
            <div class="col-md-6">
                <form>
                <h1 class="col-md-6">Faça login para continuar</h1>
                <label for="email" class="form-label">E-mail:</label>
                <input type="enail" class="form-control" id="email" placeholder="Insira seu E-mail"
                    aria-describedby="emailaluda">
                <label for="password" class="form-label">Senha:</label>
                <input type="password" class="form-control" name="password" placeholder="Digite sua senha">
                <div class="d-flex justify-content-start mt-3">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">Cadastrar</button>
                </div>
            </form>
            </div>
        </div>
    </div>
